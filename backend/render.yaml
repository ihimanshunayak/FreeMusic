# Render blueprint for Free Music Listen Together (Go backend)
#
# Deploy this service manually on Render Dashboard (Recommended):
# - New -> Web Service, connect repo
# - Root Directory: backend
# - Runtime: Go
# - Build Command: go build -o server .
# - Start Command: ./server
# - Health Check Path: /healthz
# - Plan: Free
# - Region: Singapore (or closest to you)
# - Instances: 1 (Parties live in memory, so keep to 1 instance)

services:
  - type: web
    name: freemusic-listen-together
    runtime: go
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_MAX_UPCOMING_QUEUE
        value: "25"
      - key: JAM_MAX_PARTIES
        value: "50"
      - key: JAM_CREATE_RATE_PER_MINUTE
        value: "2"
      - key: JAM_CONNECTION_IDLE_MS
        value: "900000"
      # Render terminates TLS and supplies the real client IP in X-Forwarded-For.
      - key: JAM_TRUST_PROXY
        value: "true"
      # Set to the public https origin (e.g. https://party.example.com) when a
      # proxy in front of Render may not carry X-Forwarded-Proto through;
      # invite deep links then use it verbatim.
      - key: JAM_PUBLIC_ORIGIN
        sync: false
      # Collaborative playlists and Blends.
      #
      # PLAYLIST_STORE_PATH is deliberately absent: it is unset, so playlists
      # live in memory. That is the honest configuration on this plan, because a
      # Free instance has no persistent disk — a path here would appear to work
      # and then lose every playlist on the next deploy or idle spin-down. Set it
      # (to a path on a mounted disk) only on a plan that has one.
      - key: PLAYLIST_MAX_PLAYLISTS
        value: "2000"
      - key: PLAYLIST_MAX_MEMBERS
        value: "100"
      - key: PLAYLIST_MAX_TRACKS
        value: "2000"
      - key: PLAYLIST_MAX_INVITES
        value: "20"
      - key: PLAYLIST_HISTORY_LIMIT
        value: "500"
      - key: PLAYLIST_CREATE_RATE_PER_MINUTE
        value: "2"
